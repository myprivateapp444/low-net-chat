<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Low-Net Chat</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b141a;
  color:white;
}

.app{
  width:100%;
  max-width:600px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
}

.header{
  background:#202c33;
  padding:16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.network{
  font-size:12px;
  color:#86efac;
}

.login{
  padding:25px;
  text-align:center;
  margin:auto;
  width:90%;
}

.login h1{
  font-size:32px;
}

.login p{
  color:#94a3b8;
}

.name-buttons{
  display:flex;
  gap:12px;
  margin-top:25px;
}

.name-buttons button{
  flex:1;
}

button{
  border:0;
  border-radius:12px;
  padding:14px;
  background:#16a34a;
  color:white;
  font-size:16px;
  cursor:pointer;
}

button:hover{
  opacity:.9;
}

.chat{
  display:none;
  flex:1;
  flex-direction:column;
  min-height:0;
}

.messages{
  flex:1;
  overflow-y:auto;
  padding:20px;
  background:#0b141a;
}

.message{
  max-width:80%;
  padding:10px 13px;
  margin-bottom:10px;
  border-radius:10px;
  word-wrap:break-word;
}

.me{
  margin-left:auto;
  background:#005c4b;
}

.other{
  margin-right:auto;
  background:#202c33;
}

.sender{
  font-size:11px;
  color:#86efac;
  margin-bottom:4px;
}

.time{
  font-size:10px;
  color:#94a3b8;
  text-align:right;
  margin-top:4px;
}

.input-area{
  display:flex;
  gap:8px;
  padding:10px;
  background:#202c33;
}

input{
  flex:1;
  border:0;
  outline:none;
  border-radius:12px;
  padding:14px;
  background:#2a3942;
  color:white;
  font-size:16px;
}

.send{
  width:60px;
  padding:10px;
}

.status{
  padding:8px 15px;
  font-size:12px;
  background:#111b21;
  color:#94a3b8;
}

</style>
</head>

<body>

<div class="app">

  <div class="header">
    <div class="title">💬 Low-Net Chat</div>
    <div class="network" id="network">Checking...</div>
  </div>

  <!-- LOGIN -->

  <div class="login" id="login">

    <h1>Low-Net Chat</h1>

    <p>
      Simple chat designed to use very little data.
    </p>

    <div class="name-buttons">

      <button onclick="enterChat('A')">
        👤 A
      </button>

      <button onclick="enterChat('B')">
        👤 B
      </button>

    </div>

  </div>


  <!-- CHAT -->

  <div class="chat" id="chat">

    <div class="status">
      You are <b id="currentUser"></b>
    </div>

    <div class="messages" id="messages">
    </div>

    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button
        class="send"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

/* =========================
   FIREBASE CONFIG
   ========================= */

const firebaseConfig = {
  apiKey: "AIzaSyCjt2DaN9QCUVazu-sxYAUt_aNJFI62GMQ",
  authDomain: "private-chat-app-2a7e3.firebaseapp.com",
  projectId: "private-chat-app-2a7e3",
  storageBucket: "private-chat-app-2a7e3.firebasestorage.app",
  messagingSenderId: "871441421629",
  appId: "1:871441421629:web:ed2aabb24cc528dbfca154"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();


/* =========================
   VARIABLES
   ========================= */

let currentUser = null;
let unsubscribe = null;


/* =========================
   NETWORK STATUS
   ========================= */

function updateNetwork(){

  const network = document.getElementById("network");

  if(navigator.onLine){

    network.textContent = "🟢 Online";
    network.style.color = "#86efac";

  }else{

    network.textContent = "🔴 Offline";
    network.style.color = "#fca5a5";

  }

}

window.addEventListener("online",updateNetwork);
window.addEventListener("offline",updateNetwork);

updateNetwork();


/* =========================
   ENTER CHAT
   ========================= */

async function enterChat(name){

  currentUser = name;

  try{

    await auth.signInAnonymously();

    document.getElementById("login").style.display = "none";

    document.getElementById("chat").style.display = "flex";

    document.getElementById("currentUser").textContent = name;

    listenMessages();

  }catch(error){

    alert(
      "Firebase error: " + error.code
    );

    console.log(error);

  }

}


/* =========================
   SEND MESSAGE
   ========================= */

async function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const text =
    input.value.trim();

  if(!text) return;

  if(!navigator.onLine){

    alert(
      "Internet connection nahi hai. Message network aane par bhejne ke liye save karna next step mein add karenge."
    );

    return;

  }

  try{

    await db.collection("messages").add({

      sender: currentUser,

      text: text,

      createdAt:
        firebase.firestore.FieldValue.serverTimestamp()

    });

    input.value = "";

  }catch(error){

    console.log(error);

    alert(
      "Message send nahi hua: " + error.code
    );

  }

}


/* =========================
   ENTER KEY
   ========================= */

document
  .getElementById("messageInput")
  .addEventListener("keydown",function(e){

    if(e.key === "Enter"){

      sendMessage();

    }

  });


/* =========================
   RECEIVE MESSAGES
   ========================= */

function listenMessages(){

  if(unsubscribe){

    unsubscribe();

  }

  unsubscribe =
    db.collection("messages")
      .orderBy("createdAt","asc")
      .limitToLast(100)
      .onSnapshot(

        snapshot => {

          const box =
            document.getElementById("messages");

          box.innerHTML = "";

          snapshot.forEach(doc => {

            const data = doc.data();

            const div =
              document.createElement("div");

            div.className =
              "message " +
              (data.sender === currentUser
                ? "me"
                : "other");

            const date =
              data.createdAt
                ? data.createdAt.toDate()
                : new Date();

            div.innerHTML =

              '<div class="sender">' +
              escapeHtml(data.sender) +
              '</div>' +

              '<div>' +
              escapeHtml(data.text) +
              '</div>' +

              '<div class="time">' +
              date.toLocaleTimeString([],{
                hour:"2-digit",
                minute:"2-digit"
              }) +
              '</div>';

            box.appendChild(div);

          });

          box.scrollTop =
            box.scrollHeight;

        },

        error => {

          console.log(
            "Firestore error:",
            error
          );

        }

      );

}


/* =========================
   SECURITY
   ========================= */

function escapeHtml(text){

  const div =
    document.createElement("div");

  div.textContent = text;

  return div.innerHTML;

}

</script>

</body>
</html>
