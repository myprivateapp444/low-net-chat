<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Low-Net Chat</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

<style>
*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  font-family:Arial,sans-serif;
  background:#0b141a;
  color:#fff;
}

body{
  overflow:hidden;
}

.app{
  width:100%;
  max-width:700px;
  height:100vh;
  margin:auto;
  display:flex;
  flex-direction:column;
  background:#0b141a;
}

/* HEADER */

.header{
  height:64px;
  padding:0 18px;
  background:#202c33;
  display:flex;
  align-items:center;
  justify-content:space-between;
  flex-shrink:0;
}

.title{
  font-size:20px;
  font-weight:bold;
}

.network{
  font-size:13px;
}

/* LOGIN */

.login{
  flex:1;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  padding:25px;
  text-align:center;
}

.login h1{
  font-size:38px;
  margin:0 0 12px;
}

.login p{
  color:#94a3b8;
  margin:0;
  max-width:450px;
  line-height:1.5;
}

.name-buttons{
  width:100%;
  max-width:500px;
  display:flex;
  gap:14px;
  margin-top:30px;
}

.name-buttons button{
  flex:1;
}

/* CHAT */

.chat{
  display:none;
  flex:1;
  min-height:0;
  flex-direction:column;
}

/* STATUS */

.status{
  min-height:42px;
  padding:10px 16px;
  background:#111b21;
  color:#cbd5e1;
  display:flex;
  align-items:center;
  justify-content:space-between;
  font-size:13px;
}

.user-name{
  color:#86efac;
  font-weight:bold;
}

/* MESSAGES */

.messages{
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:20px 15px;
  display:flex;
  flex-direction:column;
}

.empty{
  margin:auto;
  color:#64748b;
  text-align:center;
  font-size:14px;
}

.message{
  max-width:82%;
  padding:9px 12px;
  margin-bottom:9px;
  border-radius:10px;
  word-break:break-word;
  box-shadow:0 1px 1px rgba(0,0,0,.15);
}

.me{
  align-self:flex-end;
  background:#005c4b;
  border-bottom-right-radius:3px;
}

.other{
  align-self:flex-start;
  background:#202c33;
  border-bottom-left-radius:3px;
}

.sender{
  font-size:11px;
  color:#86efac;
  font-weight:bold;
  margin-bottom:4px;
}

.message-text{
  font-size:15px;
  line-height:1.4;
  white-space:pre-wrap;
}

.time{
  font-size:10px;
  color:#94a3b8;
  text-align:right;
  margin-top:5px;
}

/* INPUT */

.input-area{
  display:flex;
  gap:8px;
  padding:10px;
  background:#202c33;
  flex-shrink:0;
}

input{
  flex:1;
  min-width:0;
  border:0;
  outline:none;
  border-radius:12px;
  padding:14px;
  background:#2a3942;
  color:#fff;
  font-size:16px;
}

input::placeholder{
  color:#94a3b8;
}

.send{
  width:60px;
  padding:10px;
  flex-shrink:0;
}

/* BUTTON */

button{
  border:0;
  border-radius:12px;
  padding:14px;
  background:#16a34a;
  color:#fff;
  font-size:16px;
  cursor:pointer;
  transition:.15s;
}

button:hover{
  opacity:.9;
}

button:disabled{
  opacity:.5;
  cursor:not-allowed;
}

/* LOADING */

.loading{
  position:fixed;
  inset:0;
  background:#0b141a;
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:100;
  text-align:center;
}

.loading-box{
  padding:25px;
}

.loading-title{
  font-size:24px;
  font-weight:bold;
  margin-bottom:10px;
}

.loading-text{
  color:#94a3b8;
  font-size:14px;
}

/* ERROR */

.error-box{
  display:none;
  margin-top:20px;
  max-width:500px;
  padding:12px;
  border-radius:10px;
  background:#451a1a;
  color:#fecaca;
  font-size:13px;
}

/* MOBILE */

@media(max-width:500px){

  .header{
    height:58px;
    padding:0 14px;
  }

  .title{
    font-size:18px;
  }

  .login h1{
    font-size:32px;
  }

  .name-buttons{
    gap:10px;
  }

  .message{
    max-width:88%;
  }

  .messages{
    padding:15px 10px;
  }

}

/* SCROLLBAR */

.messages::-webkit-scrollbar{
  width:6px;
}

.messages::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:10px;
}

</style>
</head>

<body>

<div class="app">

  <!-- LOADING -->

  <div class="loading" id="loading">

    <div class="loading-box">

      <div class="loading-title">
        💬 Low-Net Chat
      </div>

      <div class="loading-text" id="loadingText">
        Connecting to Firebase...
      </div>

    </div>

  </div>


  <!-- HEADER -->

  <div class="header">

    <div class="title">
      💬 Low-Net Chat
    </div>

    <div
      class="network"
      id="network"
    >
      Checking...
    </div>

  </div>


  <!-- LOGIN -->

  <div
    class="login"
    id="login"
  >

    <h1>
      Low-Net Chat
    </h1>

    <p>
      Simple private chat.
    </p>

    <div class="name-buttons">

      <button
        id="buttonA"
        onclick="enterChat('A')"
      >
        👤 A
      </button>

      <button
        id="buttonB"
        onclick="enterChat('B')"
      >
        👤 B
      </button>

    </div>

    <div
      class="error-box"
      id="errorBox"
    ></div>

  </div>


  <!-- CHAT -->

  <div
    class="chat"
    id="chat"
  >

    <div class="status">

      <div>
        You are
        <span
          class="user-name"
          id="currentUser"
        ></span>
      </div>

      <div>
        🟢 Connected
      </div>

    </div>


    <div
      class="messages"
      id="messages"
    >

      <div
        class="empty"
        id="emptyMessage"
      >
        No messages yet.
      </div>

    </div>


    <div class="input-area">

      <input
        id="messageInput"
        type="text"
        maxlength="2000"
        placeholder="Type a message..."
        autocomplete="off"
      >

      <button
        class="send"
        id="sendButton"
        onclick="sendMessage()"
      >
        ➤
      </button>

    </div>

  </div>

</div>


<script>

/* =========================================
   FIREBASE CONFIG
========================================= */

const firebaseConfig = {

  apiKey:
    "AIzaSyCjt2DaN9QCUVazu-sxYAUt_aNJFI62GMQ",

  authDomain:
    "private-chat-app-2a7e3.firebaseapp.com",

  projectId:
    "private-chat-app-2a7e3",

  storageBucket:
    "private-chat-app-2a7e3.firebasestorage.app",

  messagingSenderId:
    "871441421629",

  appId:
    "1:871441421629:web:ed2aabb24cc528dbfca154"

};


/* =========================================
   FIREBASE START
========================================= */

let app;
let auth;
let db;

try{

  app = firebase.initializeApp(firebaseConfig);

  auth = firebase.auth();

  db = firebase.firestore();

}catch(error){

  console.error(error);

  document.getElementById("loadingText").textContent =
    "Firebase start nahi hua.";

}


/* =========================================
   VARIABLES
========================================= */

let currentUser = null;
let unsubscribeMessages = null;


/* =========================================
   NETWORK
========================================= */

function updateNetwork(){

  const network =
    document.getElementById("network");

  if(navigator.onLine){

    network.textContent = "🟢 Online";
    network.style.color = "#86efac";

  }else{

    network.textContent = "🔴 Offline";
    network.style.color = "#fca5a5";

  }

}

window.addEventListener(
  "online",
  updateNetwork
);

window.addEventListener(
  "offline",
  updateNetwork
);

updateNetwork();


/* =========================================
   HIDE LOADING
========================================= */

function hideLoading(){

  document.getElementById("loading").style.display =
    "none";

}


/* =========================================
   SHOW ERROR
========================================= */

function showError(message){

  const box =
    document.getElementById("errorBox");

  box.style.display = "block";

  box.textContent = message;

}


/* =========================================
   ENTER CHAT
========================================= */

async function enterChat(name){

  if(!auth){

    showError(
      "Firebase properly start nahi hua."
    );

    return;

  }

  currentUser = name;

  const buttonA =
    document.getElementById("buttonA");

  const buttonB =
    document.getElementById("buttonB");

  buttonA.disabled = true;
  buttonB.disabled = true;

  try{

    await auth.signInAnonymously();

    document.getElementById("login")
      .style.display = "none";

    document.getElementById("chat")
      .style.display = "flex";

    document.getElementById("currentUser")
      .textContent = name;

    listenMessages();

    setTimeout(function(){

      document
        .getElementById("messageInput")
        .focus();

    },100);

  }catch(error){

    console.error(
      "Firebase Authentication Error:",
      error
    );

    showError(
      "Firebase login error: " +
      error.code
    );

    buttonA.disabled = false;
    buttonB.disabled = false;

  }

}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage(){

  const input =
    document.getElementById("messageInput");

  const sendButton =
    document.getElementById("sendButton");

  const text =
    input.value.trim();

  if(!text){

    return;

  }

  if(!currentUser){

    alert(
      "Pehle A ya B select karo."
    );

    return;

  }

  if(!navigator.onLine){

    alert(
      "Internet connection nahi hai."
    );

    return;

  }

  sendButton.disabled = true;

  try{

    await db
      .collection("messages")
      .add({

        sender: currentUser,

        text: text,

        createdAt:
          firebase.firestore.FieldValue.serverTimestamp()

      });

    input.value = "";

    input.focus();

  }catch(error){

    console.error(
      "Message send error:",
      error
    );

    alert(
      "Message send nahi hua: " +
      error.code
    );

  }finally{

    sendButton.disabled = false;

  }

}


/* =========================================
   ENTER KEY
========================================= */

document
  .getElementById("messageInput")
  .addEventListener(
    "keydown",
    function(event){

      if(event.key === "Enter"){

        event.preventDefault();

        sendMessage();

      }

    }
  );


/* =========================================
   RECEIVE MESSAGES
========================================= */

function listenMessages(){

  if(unsubscribeMessages){

    unsubscribeMessages();

    unsubscribeMessages = null;

  }

  unsubscribeMessages =
    db
      .collection("messages")
      .orderBy("createdAt","asc")
      .limitToLast(100)
      .onSnapshot(

        function(snapshot){

          const box =
            document.getElementById("messages");

          const empty =
            document.getElementById("emptyMessage");

          box.innerHTML = "";

          if(snapshot.empty){

            const emptyDiv =
              document.createElement("div");

            emptyDiv.className = "empty";

            emptyDiv.textContent =
              "No messages yet.";

            box.appendChild(emptyDiv);

            return;

          }

          snapshot.forEach(
            function(doc){

              const data =
                doc.data();

              const messageDiv =
                document.createElement("div");

              messageDiv.className =
                "message " +
                (
                  data.sender === currentUser
                    ? "me"
                    : "other"
                );


              const senderDiv =
                document.createElement("div");

              senderDiv.className =
                "sender";

              senderDiv.textContent =
                data.sender || "Unknown";


              const textDiv =
                document.createElement("div");

              textDiv.className =
                "message-text";

              textDiv.textContent =
                data.text || "";


              const timeDiv =
                document.createElement("div");

              timeDiv.className =
                "time";


              let date;

              if(
                data.createdAt &&
                typeof data.createdAt.toDate === "function"
              ){

                date =
                  data.createdAt.toDate();

              }else{

                date =
                  new Date();

              }


              timeDiv.textContent =
                date.toLocaleTimeString(
                  [],
                  {
                    hour:"2-digit",
                    minute:"2-digit"
                  }
                );


              messageDiv.appendChild(
                senderDiv
              );

              messageDiv.appendChild(
                textDiv
              );

              messageDiv.appendChild(
                timeDiv
              );

              box.appendChild(
                messageDiv
              );

            }
          );


          box.scrollTop =
            box.scrollHeight;

        },

        function(error){

          console.error(
            "Firestore error:",
            error
          );

          alert(
            "Chat database error: " +
            error.code
          );

        }

      );

}


/* =========================================
   FIREBASE CHECK
========================================= */

if(auth){

  auth.onAuthStateChanged(
    function(user){

      if(user){

        console.log(
          "Firebase connected:",
          user.uid
        );

      }

    }
  );

}


/* =========================================
   PAGE READY
========================================= */

window.addEventListener(
  "load",
  function(){

    setTimeout(
      hideLoading,
      500
    );

  }
);

</script>

</body>
</html>
